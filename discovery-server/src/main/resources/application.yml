spring:
  application:
    name: discovery-server

server:
  port: 8761

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    # The registry does not register with itself
    register-with-eureka: false
    fetch-registry: false
  server:
    # Single instance (lab): keep instances even when renewals are late
    enable-self-preservation: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
