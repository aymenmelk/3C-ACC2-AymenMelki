sonar.projectKey=aymenmelki-3c-acc2-gestionprojets
sonar.projectName=aymenmelki-3c-acc2-gestionprojets
sonar.sourceEncoding=UTF-8

sonar.sources=frontend/src,backend/src/main,discovery-server/src/main
sonar.tests=frontend/src,backend/src/test,discovery-server/src/test
sonar.test.inclusions=frontend/src/**/*.spec.ts,backend/src/test/**/*.java,discovery-server/src/test/**/*.java
sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**,**/.angular/**,**/coverage/**,**/*.spec.ts

# Java: compiled classes are required, plus JUnit + JaCoCo reports produced by "mvnw clean install"
sonar.java.source=17
sonar.java.binaries=backend/target/classes,discovery-server/target/classes
sonar.java.test.binaries=backend/target/test-classes,discovery-server/target/test-classes
sonar.junit.reportPaths=backend/target/surefire-reports,discovery-server/target/surefire-reports
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml,discovery-server/target/site/jacoco/jacoco.xml

# TypeScript: lcov produced by "npm run test:ci"
sonar.javascript.lcov.reportPaths=frontend/coverage/frontend/lcov.info

# Entities/bootstrap carry no logic worth covering
sonar.coverage.exclusions=backend/src/main/java/**/entity/**,backend/src/main/java/**/BackendApplication.java,discovery-server/src/main/java/**/DiscoveryServerApplication.java,frontend/src/main.ts,frontend/src/app/app.config.ts,frontend/src/app/app.routes.ts,frontend/src/app/models/**
