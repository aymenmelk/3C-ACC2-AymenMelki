# DevOps toolchain: Jenkins + SonarQube + Prometheus + Grafana
#   cd infra && cp .env.example .env   (then edit .env)
#   docker compose up -d --build
# Jenkins http://localhost:8081 | SonarQube http://localhost:9000 | Prometheus http://localhost:9090 | Grafana http://localhost:3000
name: devops

services:
  sonar-db:
    image: postgres:16-alpine
    container_name: sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 5s
      timeout: 5s
      retries: 20

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    restart: unless-stopped
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      # Avoids the vm.max_map_count requirement on Docker Desktop / WSL2
      SONAR_SEARCH_JAVAADDITIONALOPTS: "-Dnode.store.allow_mmap=false"
      SONAR_WEB_SYSTEMPASSCODE: ${SONAR_MONITORING_PASSCODE:-devops-monitoring}
    ports:
      - "9000:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs

  # One-shot: changes admin password, creates the Jenkins token + Quality Gate webhook
  sonar-init:
    image: alpine:3.22
    container_name: sonar-init
    depends_on:
      - sonarqube
    environment:
      SONAR_ADMIN_PASSWORD: ${SONAR_ADMIN_PASSWORD:-Admin_DevOps_2026!}
    volumes:
      - ./sonar/sonar-init.sh:/sonar-init.sh:ro
      - jenkins_secrets:/var/jenkins_secrets
    entrypoint: ["sh", "/sonar-init.sh"]
    restart: "no"

  jenkins:
    build: ./jenkins
    image: aymenmelki-3c-acc2-jenkins:latest
    container_name: jenkins
    restart: unless-stopped
    user: root
    depends_on:
      sonar-init:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - jenkins_secrets:/var/jenkins_secrets:ro
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:12.1.0
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

volumes:
  sonar_db:
  sonar_data:
  sonar_extensions:
  sonar_logs:
  jenkins_home:
  jenkins_secrets:
  prometheus_data:
  grafana_data:
