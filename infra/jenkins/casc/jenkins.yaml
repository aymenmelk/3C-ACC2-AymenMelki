# Jenkins Configuration as Code — loaded at startup, no manual clicking needed.
# ${VAR:-default} values come from infra/.env (see infra/.env.example).
jenkins:
  systemMessage: "Projet DevOps — Aymen Melki — 3C-ACC2"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD:-admin}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  globalNodeProperties:
    - envVars:
        env:
          - key: "DOCKERHUB_USER"
            value: "${DOCKERHUB_USER:-aymenmelk}"
          - key: "NOTIFY_EMAIL"
            value: "${NOTIFY_EMAIL:-}"
          - key: "APP_HOST"
            value: "host.docker.internal"

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "sonar-token"
              description: "SonarQube analysis token (generated by sonar-init)"
              secret: "${readFile:/var/jenkins_secrets/sonar-token}"
          - usernamePassword:
              scope: GLOBAL
              id: "dockerhub-creds"
              description: "Docker Hub"
              username: "${DOCKERHUB_USER:-aymenmelk}"
              password: "${DOCKERHUB_TOKEN:-changeme}"

unclassified:
  location:
    url: "http://localhost:8081/"
    adminAddress: "${SMTP_FROM:-jenkins@localhost}"
  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: "SonarQube"
        serverUrl: "http://sonarqube:9000"
        credentialsId: "sonar-token"
  mailer:
    smtpHost: "${SMTP_HOST:-smtp.gmail.com}"
    smtpPort: "${SMTP_PORT:-465}"
    useSsl: true
    charset: "UTF-8"
    authentication:
      username: "${SMTP_USER:-}"
      password: "${SMTP_PASSWORD:-}"

jobs:
  - script: >
      pipelineJob('gestionprojets-pipeline') {
        description('CI/CD : Maven -> Tests -> SonarQube -> Docker -> Deploy (Spring + MySQL + Angular)')
        definition {
          cpsScm {
            scm {
              git {
                remote { url('${GIT_REPO_URL:-https://github.com/aymenmelk/3C-ACC2-AymenMelki.git}') }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(true)
          }
        }
      }
