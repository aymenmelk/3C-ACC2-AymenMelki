# Mirror of the Jenkins pipeline on GitHub Actions + an end-to-end test of the whole DevOps toolchain.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Maven clean install + JaCoCo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: mvn clean install
        working-directory: backend
        run: chmod +x mvnw && ./mvnw -B clean install
      - name: mvn clean install (microservice discovery-server / Eureka)
        working-directory: discovery-server
        run: chmod +x mvnw && ./mvnw -B clean install
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports
            backend/target/site/jacoco

  frontend:
    name: Frontend (Vitest + coverage + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run test:ci
          npm run build

  app-stack:
    name: Docker compose (Spring + MySQL + Angular) smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up
        run: docker compose up -d --build
      - name: Smoke test the API, frontend and metrics
        run: |
          for i in $(seq 1 60); do curl -fs localhost:8080/actuator/health | grep -q '"UP"' && break; sleep 3; done
          curl -fsS localhost:8080/actuator/health; echo
          curl -fsS -X POST localhost:8080/entreprise/add -H 'Content-Type: application/json' -d '{"nom":"Esprit","adresse":"Tunis"}'; echo
          curl -fsS localhost:8080/entreprise/all | grep -q Esprit && echo "MySQL persistence OK"
          curl -fsS -o /dev/null localhost:4200 && echo "Frontend OK"
          curl -fsS localhost:4200/api/entreprise/all | grep -q Esprit && echo "Frontend -> backend proxy OK"
          curl -fsS localhost:8080/actuator/prometheus | grep -q http_server_requests && echo "Prometheus metrics OK"
          for i in $(seq 1 24); do curl -fs -H 'Accept: application/json' localhost:8761/eureka/apps/BACKEND | grep -q '"UP"' && break; sleep 5; done
          curl -fsS -H 'Accept: application/json' localhost:8761/eureka/apps/BACKEND | grep -q '"UP"' && echo "Backend registered in Eureka"
      - if: failure()
        run: docker compose logs --tail=200
      - if: always()
        run: docker compose down -v

  kubernetes:
    name: Kubernetes (kind) - PODs Spring, MySQL, Angular, Eureka, Monitoring, SonarQube
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build artifacts and images (same as Jenkins)
        run: |
          (cd backend && chmod +x mvnw && ./mvnw -B -q package -DskipTests)
          (cd discovery-server && chmod +x mvnw && ./mvnw -B -q package -DskipTests)
          (cd frontend && npm ci --no-audit --no-fund && npm run build)
          docker build -f backend/Dockerfile.jenkins  -t aymenbay/aymenmelki-3c-acc2-gestionprojets-backend:42  ./backend
          docker build -f frontend/Dockerfile.jenkins -t aymenbay/aymenmelki-3c-acc2-gestionprojets-frontend:42 ./frontend
          docker build -f discovery-server/Dockerfile.jenkins -t aymenbay/aymenmelki-3c-acc2-gestionprojets-discovery:42 ./discovery-server
      - uses: helm/kind-action@v1
        with:
          cluster_name: devops
      - name: Load images into the cluster and deploy (kubectl apply -k k8s)
        run: |
          kind load docker-image --name devops aymenbay/aymenmelki-3c-acc2-gestionprojets-backend:42 aymenbay/aymenmelki-3c-acc2-gestionprojets-frontend:42 aymenbay/aymenmelki-3c-acc2-gestionprojets-discovery:42
          IMAGE_TAG=42; sed -i "s#newTag: latest#newTag: \"${IMAGE_TAG}\"#" k8s/kustomization.yaml   # same command as the Jenkinsfile (numeric tag)
          kubectl apply -k k8s
          kubectl -n gestionprojets rollout status deployment/mysql --timeout=300s
          kubectl -n gestionprojets rollout status deployment/discovery --timeout=300s
          kubectl -n gestionprojets rollout status deployment/backend --timeout=600s
          kubectl -n gestionprojets rollout status deployment/frontend --timeout=300s
          kubectl -n gestionprojets rollout status deployment/monitoring --timeout=300s
          kubectl -n gestionprojets get pods,svc,pvc -o wide
      - name: SonarQube POD + sonar-init against it
        run: |
          # the kind node pulls sonarqube/postgres/busybox from Docker Hub itself
          kubectl apply -k k8s/sonarqube
          kubectl -n sonarqube rollout status deployment/sonar-db --timeout=300s
          kubectl -n sonarqube rollout status deployment/sonarqube --timeout=900s
          kubectl -n sonarqube get pods,svc,pvc
          kubectl -n sonarqube port-forward svc/sonarqube 19000:9000 >/dev/null 2>&1 &
          sleep 5
          mkdir -p /tmp/secrets
          docker run --rm --network host -e SONAR_URL=http://localhost:19000 -e JENKINS_WEBHOOK_URL=http://jenkins.example:8081/sonarqube-webhook/ \
            -v "$PWD/infra/sonar/sonar-init.sh:/sonar-init.sh:ro" -v /tmp/secrets:/var/jenkins_secrets alpine:3.22 sh /sonar-init.sh
          TOKEN=$(cat /tmp/secrets/sonar-token)
          curl -fsS -u "$TOKEN:" localhost:19000/api/authentication/validate | grep -q '"valid":true' && echo "SonarQube POD token OK"
          # second run must keep the valid token (idempotent)
          docker run --rm --network host -e SONAR_URL=http://localhost:19000 -e JENKINS_WEBHOOK_URL=http://jenkins.example:8081/sonarqube-webhook/ \
            -v "$PWD/infra/sonar/sonar-init.sh:/sonar-init.sh:ro" -v /tmp/secrets:/var/jenkins_secrets alpine:3.22 sh /sonar-init.sh | grep -q "existing token is valid"
          [ "$(cat /tmp/secrets/sonar-token)" = "$TOKEN" ] && echo "sonar-init is idempotent"
      - name: Smoke test the PODs
        run: |
          kubectl -n gestionprojets port-forward svc/frontend 18080:80 >/dev/null 2>&1 &
          kubectl -n gestionprojets port-forward svc/backend 18081:8080 >/dev/null 2>&1 &
          kubectl -n gestionprojets port-forward svc/prometheus 19090:9090 >/dev/null 2>&1 &
          kubectl -n gestionprojets port-forward svc/grafana 13000:3000 >/dev/null 2>&1 &
          kubectl -n gestionprojets port-forward svc/discovery 18761:8761 >/dev/null 2>&1 &
          sleep 8
          curl -fsS localhost:18081/actuator/health; echo
          curl -fsS -X POST localhost:18080/api/entreprise/add -H 'Content-Type: application/json' -d '{"nom":"K8s","adresse":"Tunis"}'; echo
          curl -fsS localhost:18080/api/entreprise/all | grep -q K8s && echo "Angular POD -> Spring POD -> MySQL POD OK"
          curl -fsS localhost:13000/api/health; echo
          for i in $(seq 1 24); do curl -fs -H 'Accept: application/json' localhost:18761/eureka/apps/BACKEND | grep -q '"UP"' && break; sleep 5; done
          curl -fsS -H 'Accept: application/json' localhost:18761/eureka/apps/BACKEND | grep -q '"UP"' && echo "Spring POD registered in the Eureka POD"
          sleep 25
          curl -fsS 'localhost:19090/api/v1/query?query=up{job="spring-backend"}' | tee /dev/stderr | grep -q '"1"' && echo "Prometheus scrapes the Spring POD"
          curl -fsS -u admin:admin localhost:13000/api/dashboards/uid/gestionprojets-devops | grep -q gestionprojets-devops && echo "Grafana dashboard OK"
      - if: failure()
        run: |
          kubectl -n gestionprojets get pods -o wide
          kubectl -n gestionprojets describe pods | tail -100
          kubectl -n gestionprojets logs deployment/backend --tail=100 || true

  iac-terraform-ansible:
    name: IaC - Terraform (Docker containers) + Ansible (tool configuration)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Terraform fmt / init / validate
        working-directory: iac/terraform
        run: |
          terraform fmt -check -recursive -diff
          terraform init -input=false
          terraform validate
      - name: Ansible syntax check
        working-directory: iac/ansible
        run: |
          pipx install ansible-core || pip install --user ansible-core
          ansible-playbook --syntax-check provision.yml configure.yml site.yml
      - name: Terraform apply (Jenkins, SonarQube, Prometheus, Grafana containers)
        working-directory: iac/terraform
        run: |
          mkdir -p "$HOME/.kube"
          terraform apply -input=false -auto-approve -var sonar_in_docker=true -var "kube_dir=$HOME/.kube"
          terraform output
          docker ps --format '{{.Names}}\t{{.Status}}'
      - name: Ansible configure (SonarQube project + Quality Gate, Grafana home, Jenkins/Prometheus checks)
        working-directory: iac/ansible
        run: |
          ansible-playbook configure.yml -e sonar_url=http://localhost:9000
          # idempotence: a second run must succeed too
          ansible-playbook configure.yml -e sonar_url=http://localhost:9000
      - name: Verify the configuration done by Terraform + Ansible
        run: |
          curl -fsS -u 'admin:Admin_DevOps_2026!' "localhost:9000/api/qualitygates/get_by_project?project=aymenmelki-3c-acc2-gestionprojets" | tee /dev/stderr | grep -q '"name":"Sonar way"' && echo
          curl -fsS -u admin:admin localhost:3000/api/org/preferences | tee /dev/stderr | grep -q gestionprojets-devops && echo
          curl -fsS -u admin:admin localhost:8081/job/gestionprojets-pipeline/api/json | grep -q gestionprojets-pipeline && echo "Jenkins job OK"
      - if: failure()
        run: docker logs --tail 80 sonar-init; docker logs --tail 80 jenkins
      - if: always()
        working-directory: iac/terraform
        run: terraform destroy -input=false -auto-approve -var sonar_in_docker=true -var "kube_dir=$HOME/.kube" || true

  ansible-provision:
    name: Ansible provision of a fresh Ubuntu (Docker, k3s, Terraform, SonarQube POD)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: ansible-playbook provision.yml (what runs in the VMware VM)
        working-directory: iac/ansible
        run: |
          pipx install ansible-core || pip install --user ansible-core
          ansible-playbook provision.yml -e repo_url=https://github.com/${{ github.repository }}.git
      - name: Check the result
        run: |
          java -version 2>&1 | head -1; mvn -v | head -1; docker --version; terraform version | head -1
          kubectl get nodes || sudo k3s kubectl get nodes
          sudo k3s kubectl -n sonarqube get pods,svc
          curl -fsS localhost:30900/api/system/status | tee /dev/stderr | grep -q '"UP"' && echo " SonarQube POD UP"
          ls ~/3C-ACC2-AymenMelki/Jenkinsfile
      - if: failure()
        run: sudo k3s kubectl -n sonarqube describe pods | tail -60 || true

  devops-toolchain:
    name: Jenkins + SonarQube + Grafana end-to-end (runs the real Jenkinsfile)
    runs-on: ubuntu-latest
    needs: [app-stack]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Prepare infra/.env
        working-directory: infra
        run: |
          cp .env.example .env
          sed -i '/^GIT_REPO_URL=/d; /^SONAR_URL=/d' .env
          # CI has no Kubernetes next to Jenkins: SonarQube runs in Docker here (same compose file, profile)
          echo "COMPOSE_PROFILES=sonar-docker" >> .env
          echo "SONAR_URL=http://sonarqube:9000" >> .env
          echo "GIT_REPO_URL=https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" >> .env
      - name: Start toolchain
        working-directory: infra
        run: docker compose up -d --build
      - name: Wait for Jenkins + check JCasC created the job
        run: |
          for i in $(seq 1 90); do curl -fs -o /dev/null -u admin:admin localhost:8081/api/json && break; sleep 5; done
          curl -fsS -u admin:admin localhost:8081/job/gestionprojets-pipeline/api/json | grep -q gestionprojets-pipeline
          docker logs sonar-init
      - name: Trigger the pipeline and wait for the result
        run: |
          J=localhost:8081; C=$(mktemp)
          CRUMB=$(curl -fs -c $C -u admin:admin "$J/crumbIssuer/api/xml?xpath=concat(//crumbRequestField,\":\",//crumb)")
          curl -fsS -b $C -u admin:admin -H "$CRUMB" -X POST "$J/job/gestionprojets-pipeline/build"
          for i in $(seq 1 30); do curl -fs -u admin:admin "$J/job/gestionprojets-pipeline/1/api/json" -o /dev/null && break; sleep 5; done
          while curl -fs -u admin:admin "$J/job/gestionprojets-pipeline/1/api/json" | grep -q '"building":true'; do sleep 15; done
          RESULT=$(curl -fs -u admin:admin "$J/job/gestionprojets-pipeline/1/api/json" | sed -n 's/.*"result":"\([A-Z]*\)".*/\1/p')
          curl -fs -u admin:admin "$J/job/gestionprojets-pipeline/1/consoleText" | tail -150
          echo "Jenkins build result: $RESULT"
          # UNSTABLE = everything passed except the Docker Hub push (no real token in CI)
          [ "$RESULT" = "SUCCESS" ] || [ "$RESULT" = "UNSTABLE" ]
      - name: Check SonarQube analysis, Prometheus targets and Grafana dashboard
        run: |
          curl -fsS -u 'admin:Admin_DevOps_2026!' "localhost:9000/api/qualitygates/project_status?projectKey=aymenmelki-3c-acc2-gestionprojets"; echo
          curl -fsS -u 'admin:Admin_DevOps_2026!' "localhost:9000/api/measures/component?component=aymenmelki-3c-acc2-gestionprojets&metricKeys=coverage,bugs,vulnerabilities,code_smells"; echo
          sleep 20
          curl -fsS localhost:9090/api/v1/targets | grep -o '"job":"[a-z-]*"[^}]*"health":"[a-z]*"' | sort -u || true
          curl -fsS 'localhost:9090/api/v1/query?query=up' ; echo
          curl -fsS -u admin:admin localhost:3000/api/dashboards/uid/gestionprojets-devops | grep -q '"uid":"gestionprojets-devops"' && echo "Grafana dashboard OK"
      - if: failure()
        working-directory: infra
        run: docker compose logs --tail=150
