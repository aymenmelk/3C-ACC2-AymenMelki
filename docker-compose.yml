# Livraison continue : Spring Boot + MySQL + Angular
# Usage:  docker compose up -d --build        (images are built locally)
#    or:  IMAGE_TAG=12 docker compose up -d   (with images pulled from Docker Hub after the Jenkins push)
name: gestionprojets

services:
  mysql:
    image: mysql:8.4
    container_name: gp-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gestion_projets}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"   # 3307 on the host: your local MySQL 9.1 already uses 3306
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    image: ${DOCKERHUB_USER:-aymenbay}/aymenmelki-3c-acc2-gestionprojets-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
    container_name: gp-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-gestion_projets}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: ${DOCKERHUB_USER:-aymenbay}/aymenmelki-3c-acc2-gestionprojets-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
    container_name: gp-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  mysql_data:
