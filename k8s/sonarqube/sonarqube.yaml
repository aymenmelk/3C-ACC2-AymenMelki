# POD SonarQube — conteneur SonarQube (analyse de code lancée par Jenkins)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarqube-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarqube
  labels: { app: sonarqube }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: sonarqube }
  template:
    metadata:
      labels: { app: sonarqube }
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: wait-for-db
          image: busybox:1.37
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until nc -z sonar-db 5432; do echo waiting for sonar-db; sleep 3; done"]
      containers:
        - name: sonarqube
          image: sonarqube:community
          imagePullPolicy: IfNotPresent
          env:
            - name: SONAR_JDBC_URL
              value: jdbc:postgresql://sonar-db:5432/sonar
            - name: SONAR_JDBC_USERNAME
              valueFrom: { secretKeyRef: { name: sonar-db-secret, key: POSTGRES_USER } }
            - name: SONAR_JDBC_PASSWORD
              valueFrom: { secretKeyRef: { name: sonar-db-secret, key: POSTGRES_PASSWORD } }
            # No vm.max_map_count requirement (works on Docker Desktop and k3s as is)
            - name: SONAR_SEARCH_JAVAADDITIONALOPTS
              value: "-Dnode.store.allow_mmap=false"
          ports:
            - containerPort: 9000
          volumeMounts:
            - name: data
              mountPath: /opt/sonarqube/data
              subPath: data
            - name: data
              mountPath: /opt/sonarqube/extensions
              subPath: extensions
          startupProbe:
            tcpSocket: { port: 9000 }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /api/system/status, port: 9000 }
            periodSeconds: 10
          resources:
            requests: { cpu: 200m, memory: 1536Mi }
            limits: { memory: 3Gi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sonarqube-data
---
apiVersion: v1
kind: Service
metadata:
  name: sonarqube
spec:
  type: NodePort
  selector: { app: sonarqube }
  ports:
    - port: 9000
      targetPort: 9000
      nodePort: 30900
